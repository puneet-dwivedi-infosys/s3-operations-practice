name: Test Pipeline

on:
    pull_request: 
        branches: ['main']
    push :
        branches: ['main', 'working']

jobs :
    tests :
        runs-on: ubuntu-latest

        steps : 
            - name : Checkout code
              uses : actions/checkout@v3

            - name : Python setup
              uses : actions/setup-python@v5
              with:
                python-version: '3.12.5'
            
            - name : Running Tests
              run : |
                python -m venv venv
                pip install -r requirements.txt
                pytest tests



